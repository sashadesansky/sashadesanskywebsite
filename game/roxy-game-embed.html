<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Roxy's Churu Run</title>

<link rel="icon" href="../images/favicon.svg" type="image/svg+xml">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@400;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="roxy-game.css">
<style>
  /* Embedded (iframe) variant — just the game, no page chrome */
  body {
    margin: 0;
    padding: var(--space-md);
  }
  .game-frame {
    max-width: 100%;
  }
  .touch-controls {
    max-width: 100%;
  }
</style>
</head>
<body>

<div class="game-frame">
  <canvas id="game-canvas" width="960" height="540" aria-label="Roxy's Churu Run game canvas"></canvas>

  <div id="overlay" class="game-overlay">
    <div class="overlay-panel">
      <img id="overlay-portrait" class="overlay-portrait" src="../images/roxy-portrait.jpg" alt="Roxy the Maine Coon">
      <h2 id="overlay-title">Roxy's Churu Run</h2>
      <p id="overlay-text">
        Help Roxy collect churus and reach the yarn ball at the end of each level —
        watch out for computer cords along the way!
      </p>
      <div class="overlay-controls">
        <div><strong>Move</strong> — Arrow Keys or A / D</div>
        <div><strong>Jump</strong> — Space, Up, or W</div>
      </div>
      <button class="button-primary" id="overlay-button">Start Game</button>
    </div>
  </div>
</div>

<div class="touch-controls" id="touch-controls">
  <div class="touch-side">
    <button class="touch-btn" id="btn-left" aria-label="Move left">&larr;</button>
    <button class="touch-btn" id="btn-right" aria-label="Move right">&rarr;</button>
  </div>
  <button class="touch-btn touch-btn-jump" id="btn-jump" aria-label="Jump">JUMP</button>
</div>

<script src="roxy-game.js"></script>
</body>
</html>
